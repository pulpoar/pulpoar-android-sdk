name: Release

# Announces a version that the private build repository already published to the CDN. It publishes nothing itself:
# it proves that what partners resolve is complete, intact and installable, then records it, tags it and creates the
# GitHub release under the tag <product>-<version> (Try-On and SkinAI each have their own version line). If the tag
# lands but the GitHub release does not, finish it with scripts/finish_release.sh; never re-tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published by the source repository's Android Try-On or SkinAI Release, e.g. 0.1.0 (no leading v)"
        required: true
      product:
        # A string, not a choice: a choice preselects a product, and a release under the wrong one burns its version.
        description: "Which SDK the version releases: tryon or skinai (each has its own version line)"
        required: true
        type: string

permissions:
  contents: write

# Runs queue, and each checks out the default branch when it starts, so it commits on top of the one before it.
# GitHub keeps one pending run per group (a third dispatch cancels the queued second): dispatch one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only from the default branch; the push below must not carry other branches' commits into it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      PRODUCT: ${{ inputs.product }}
      TAG: ${{ inputs.product }}-${{ inputs.version }}
      NAME: ${{ inputs.product == 'skinai' && 'SkinAI' || 'Try-On' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }} # the latest, not the commit this run was dispatched at

      - name: Validate
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts
          # Product, version, not yet recorded in either layout, and a non-empty '## <Name> <version>' changelog section.
          python3 scripts/release_guard.py check "$PRODUCT" "$VERSION"
          # Standalone assignment, so a network error fails the step instead of reading as "no tag".
          existing=$(git ls-remote --tags origin "refs/tags/$TAG")
          [[ -z "$existing" ]] || { echo "tag $TAG already exists"; exit 1; }

      - name: Verify the published files
        run: python3 scripts/verify_release.py "$VERSION" --product "$PRODUCT" --work "$RUNNER_TEMP/verify"

      - name: Read the engine version
        id: engine
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          info = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "verify", "build-info.json")))
          print("version=" + info["engine"]["coordinate"].split(":")[2])
          # Only a pre-release may carry an engine that build-info.json admits is not 16 KB aligned (verify_release.py enforces it).
          unaligned = "-" in os.environ["VERSION"] and not all(info["engine"]["native_libraries_16kb_aligned"].values())
          print("unaligned=" + str(unaligned).lower())
          PY

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build a partner app from the CDN
        working-directory: consumer
        run: |
          ./gradlew --no-daemon --console=plain -Pproduct="$PRODUCT" -PsdkVersion="$VERSION" -PexpectedEngine="${{ steps.engine.outputs.version }}" \
            :app:verifyResolvedEngine :app:assembleDebug :app:assembleRelease

      - name: The app runs on 16 KB page devices
        if: steps.engine.outputs.unaligned != 'true'
        run: python3 scripts/check_apk_16kb.py consumer/app/build/outputs/apk/debug/*.apk consumer/app/build/outputs/apk/release/*.apk

      - name: Record, tag and release
        run: |
          python3 scripts/release_guard.py notes "$PRODUCT" "$VERSION" "$RUNNER_TEMP/notes.md"
          mkdir -p "releases/$PRODUCT"
          cp "$RUNNER_TEMP/verify/build-info.json" "releases/$PRODUCT/$VERSION.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "releases/$PRODUCT/$VERSION.json"
          git commit -m "Release $NAME $VERSION"
          git tag -a "$TAG" -m "PulpoAR Android SDK: $NAME $VERSION"
          # Atomic: either the branch and the tag both land or neither does, so a rejected push can be retried.
          git push --atomic origin HEAD:${{ github.event.repository.default_branch }} "$TAG"
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease --latest=false)
          gh release create "$TAG" --verify-tag --title "$NAME $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
